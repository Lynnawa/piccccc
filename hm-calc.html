<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时长计算器</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#222;--mu:#777;--ac:#2f6f5e;--ac2:#e3f0ec;--bd:#e2e0d8;--err:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a19;--card:#232625;--tx:#eee;--mu:#999;--ac:#6fc2a8;--ac2:#27403a;--bd:#363a38;--err:#ff7b6b}}
:root[data-theme="dark"]{--bg:#181a19;--card:#232625;--tx:#eee;--mu:#999;--ac:#6fc2a8;--ac2:#27403a;--bd:#363a38;--err:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 14px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--bd)}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px 4px;border-radius:8px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number]{flex:1;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button.pri{padding:10px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
button.ghost{border:0;background:none;color:var(--mu);cursor:pointer;font-size:14px}
.hint{color:var(--mu);font-size:12.5px;margin:8px 0 0}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--bd);font-size:15px}
li .r{color:var(--mu);font-size:13px;margin-left:8px;flex:1;text-align:right}
li.bad .r{color:var(--err)}
.total{background:var(--ac2);border-radius:12px;padding:12px;margin-top:12px}
.total div{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding:2px 0}
.total small{font-size:12.5px;color:var(--mu);font-weight:400}
.out{margin-top:10px;font-size:17px;font-weight:600;color:var(--ac)}
.lbl{color:var(--mu);font-size:13px}
.clr{display:block;width:100%;margin-top:10px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--err);font-size:16px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>⏱ 时长计算器</h1>

<div class="card">
  <h2>“3.30”这样的纯数字怎么算？</h2>
  <div class="seg" id="mode">
    <button data-m="hm" class="on">3.30 = 3小时30分</button>
    <button data-m="dec">3.30 = 3.3小时</button>
  </div>
  <p class="hint">带单位的写法不受影响：“3小时30分”“30分”“3.5小时”“3:30”“2h15m”都能识别。</p>
</div>

<div class="card">
  <h2>累加</h2>
  <div class="row">
    <input type="text" id="inp" placeholder="输入后回车，如 3.30 或 6小时30分" autocomplete="off">
    <button class="pri" id="add">添加</button>
  </div>
  <p class="hint">可一次粘贴多条，用换行、逗号或 + 分隔。纯整数（如 “3”）按小时算，分钟请写“30分”或“.30”。</p>
  <ul id="list"></ul>
  <div class="total">
    <div><span>共计</span><span id="t1">0小时0分</span></div>
    <div><span>&nbsp;</span><span id="t2">0.00小时</span></div>
    <div><small id="cnt">0 条</small><small id="t3">0 分钟</small></div>
  </div>
  <button class="clr" id="clear">清空</button>
</div>

<div class="card">
  <h2>换算</h2>
  <div class="seg" id="cvmode">
    <button data-c="hm" class="on">x小时x分 → x.xx小时</button>
    <button data-c="dec">x.xx小时 → x小时x分</button>
  </div>
  <div class="row" id="pHM" style="margin-top:10px">
    <input type="number" id="ch" inputmode="decimal" placeholder="小时" min="0">
    <span>小时</span>
    <input type="number" id="cm" inputmode="decimal" placeholder="分" min="0">
    <span>分</span>
  </div>
  <div class="row" id="pDec" style="margin-top:10px;display:none">
    <input type="number" id="dh" inputmode="decimal" placeholder="如 3.75" min="0" step="any">
    <span>小时</span>
  </div>
  <div class="out" id="o1">—</div>
</div>
</main>

<script>
let mode='hm', items=[];
const $=id=>document.getElementById(id);

function fmtHM(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h+'小时'+m+'分'}
function fmtDec(min){return (min/60).toFixed(2)+'小时'}

// returns minutes, or {err}
function parse(raw){
  let s=raw.replace(/\s+/g,'').replace(/：/g,':');
  if(!s)return{err:'空'};
  s=s.replace(/小时|小時|时|時|hours?|hrs?|h/gi,'H').replace(/分钟|分鐘|分|minutes?|mins?|m/gi,'M');
  let r;
  if(r=s.match(/^(\d+(?:\.\d+)?)H(?:(\d+(?:\.\d+)?)M?)?$/)) return +r[1]*60+(r[2]?+r[2]:0);
  if(r=s.match(/^(\d+(?:\.\d+)?)M$/)) return +r[1];
  if(r=s.match(/^(\d+):(\d{1,2})$/)){ if(+r[2]>=60)return{err:'分钟不能≥60'}; return +r[1]*60+ +r[2]; }
  if(r=s.match(/^(\d*)(?:\.(\d+))?$/) ){
    if(!r[1]&&!r[2])return{err:'无法识别'};
    if(mode==='dec') return parseFloat(s)*60;
    const h=+(r[1]||0);
    if(!r[2]) return h*60;
    if(r[2].length>2)return{err:'小数位超过2位，无法当作分钟'};
    const m=+(r[2].padEnd(2,'0'));
    if(m>=60)return{err:'分钟不能≥60'};
    return h*60+m;
  }
  return{err:'无法识别'};
}

function render(){
  const ul=$('list');ul.innerHTML='';let total=0,ok=0;
  items.forEach((raw,i)=>{
    const v=parse(raw);const li=document.createElement('li');
    const a=document.createElement('span');a.textContent=raw;
    const b=document.createElement('span');b.className='r';
    if(typeof v==='object'){li.className='bad';b.textContent=v.err}
    else{total+=v;ok++;b.textContent='= '+fmtHM(v)+' ｜ '+(v/60).toFixed(2)+'h'}
    const d=document.createElement('button');d.className='ghost';d.textContent='✕';d.onclick=()=>{items.splice(i,1);render()};
    li.append(a,b,d);ul.append(li);
  });
  $('t1').textContent=fmtHM(total);$('t2').textContent=fmtDec(total);
  $('t3').textContent=Math.round(total)+' 分钟';$('cnt').textContent=ok+' 条'+(ok<items.length?'（'+(items.length-ok)+' 条无法识别，未计入）':'');
}
function add(){
  const parts=$('inp').value.split(/[\n,，;；+＋]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return;
  items.push(...parts);$('inp').value='';render();$('inp').focus();
}
$('add').onclick=add;
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
$('clear').onclick=()=>{items=[];render()};
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));render();
});

let cv='hm';
function conv(){
  const o=$('o1');
  if(cv==='hm'){
    if(!$('ch').value&&!$('cm').value){o.textContent='—';return}
    const h=parseFloat($('ch').value)||0,m=parseFloat($('cm').value)||0;
    o.textContent=((h*60+m)/60).toFixed(2)+' 小时';
  }else{
    const v=parseFloat($('dh').value);
    o.textContent=isNaN(v)?'—':fmtHM(v*60);
  }
}
['ch','cm','dh'].forEach(id=>$(id).oninput=conv);
document.querySelectorAll('#cvmode button').forEach(b=>b.onclick=()=>{
  cv=b.dataset.c;
  document.querySelectorAll('#cvmode button').forEach(x=>x.classList.toggle('on',x===b));
  $('pHM').style.display=cv==='hm'?'flex':'none';
  $('pDec').style.display=cv==='dec'?'flex':'none';
  conv();
});
render();
</script>
</body>
</html>
